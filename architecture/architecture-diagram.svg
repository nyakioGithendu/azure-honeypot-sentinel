<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="900" height="1000" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="330" y="20" width="240" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Internet</text>
  <text x="450" y="65" text-anchor="middle" font-size="12" fill="#c0392b">Open inbound NSG rule</text>
  <line x1="450" y1="80" x2="450" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VM -->
  <rect x="270" y="115" width="360" height="90" rx="8" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="2"/>
  <text x="450" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c6fbb">Windows 10 Enterprise VM</text>
  <text x="450" y="160" text-anchor="middle" font-size="12" fill="#2c6fbb">Standard D2s v3 · Australia East</text>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="#2c6fbb">Windows Firewall disabled (intentionally exposed)</text>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#888">Azure Monitor Agent (AMA)</text>
  <line x1="450" y1="205" x2="450" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DCR -->
  <rect x="310" y="240" width="280" height="60" rx="8" fill="#eef7ea" stroke="#3a8a3a" stroke-width="2"/>
  <text x="450" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a8a3a">Data Collection Rule (DCR)</text>
  <text x="450" y="283" text-anchor="middle" font-size="12" fill="#3a8a3a">Scoped to honeypot VM</text>
  <line x1="450" y1="300" x2="450" y2="335" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAW -->
  <rect x="310" y="335" width="280" height="60" rx="8" fill="#fff6e0" stroke="#c98a13" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#c98a13">Log Analytics Workspace</text>
  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#c98a13">Central log repository (LAW)</text>
  <line x1="450" y1="395" x2="450" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sentinel -->
  <rect x="270" y="430" width="360" height="70" rx="8" fill="#f2eafb" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">Microsoft Sentinel (SIEM)</text>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#7c3aed">Detection · Enrichment · Visualization</text>

  <!-- Branch lines -->
  <line x1="450" y1="500" x2="450" y2="520" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="520" x2="230" y2="520" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="520" x2="670" y2="520" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="520" x2="230" y2="555" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="520" x2="670" y2="555" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Watchlist -->
  <rect x="90" y="555" width="280" height="80" rx="8" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="2"/>
  <text x="230" y="580" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c6fbb">Sentinel Watchlist</text>
  <text x="230" y="598" text-anchor="middle" font-size="12" fill="#2c6fbb">"geoip" — ~54,000 rows</text>
  <text x="230" y="616" text-anchor="middle" font-size="12" fill="#2c6fbb">IP → geographic location</text>

  <!-- Workbook -->
  <rect x="530" y="555" width="280" height="80" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="670" y="580" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Sentinel Workbook</text>
  <text x="670" y="598" text-anchor="middle" font-size="12" fill="#c0392b">Custom Query element</text>
  <text x="670" y="616" text-anchor="middle" font-size="12" fill="#c0392b">Renders attack map</text>

  <line x1="230" y1="635" x2="230" y2="665" stroke="#555" stroke-width="2"/>
  <line x1="230" y1="665" x2="670" y2="665" stroke="#555" stroke-width="2"/>
  <line x1="670" y1="635" x2="670" y2="665" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="665" x2="450" y2="700" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="230" y="700" width="440" height="80" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
  <text x="450" y="728" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">KQL Queries / Detection &amp; Analysis</text>
  <text x="450" y="748" text-anchor="middle" font-size="12" fill="#555">Enriched, geo-tagged, and visualized</text>
  <text x="450" y="765" text-anchor="middle" font-size="12" fill="#555">brute-force activity (T1110 / T1595)</text>

  <!-- Legend -->
  <text x="450" y="830" text-anchor="middle" font-size="12" fill="#999">Azure Honeypot &amp; Sentinel SIEM Detection Pipeline</text>
</svg>
